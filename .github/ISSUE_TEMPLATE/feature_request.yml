name: Feature request
description: An idea or something the addon should do.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: English or Spanish are both fine.
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: The problem or the workflow, more than the solution. For example "the agent can't see the animation tracks of a scene".
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How could it work?
      description: Optional. Where in the editor, which mode, what the agent should be able to do.
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
