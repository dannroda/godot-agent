name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    name: Tests (Godot ${{ matrix.godot }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # La mínima soportada, la estable actual y la beta en la que se desarrolla.
        godot: [4.7.2-stable, 4.8-beta1]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: ~/godot
          key: godot-${{ matrix.godot }}

      - name: Install Godot
        run: sh .github/scripts/install-godot.sh ~/godot ${{ matrix.godot }}

      - name: Import
        run: ~/godot/godot --headless --path . --import

      # Los checkpoints del One-shot hacen commits en un repo de prueba.
      - name: Git identity
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@users.noreply.github.com"

      - name: Unit tests
        run: ~/godot/godot --headless --path . --script tests/run_all.gd

      - name: ACP against the fake agent
        run: ~/godot/godot --headless --path . --script tests/acp_session_check.gd

      - name: One-shot loop
        run: ~/godot/godot --headless --path . --script tests/oneshot_check.gd

      # Habilitar y deshabilitar el plugin 5 veces sin huérfanos ni recursos colgados (m13-10).
      # scope_compass (el tablero) no está en el repo.
      - name: Plugin enable/disable cycle
        run: |
          sed -i 's|, "res://addons/scope_compass/plugin.cfg"||' project.godot
          ~/godot/godot --headless --path . --script tests/plugin_cycle_check.gd

  # C# (m14-07): validate_scripts compila con dotnet build; el test compila un proyecto de verdad.
  csharp:
    name: C# (Godot .NET 4.7.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/cache@v6
        with:
          path: ~/godot-mono
          key: godot-mono-4.7.2-stable

      - name: Install Godot .NET
        run: sh .github/scripts/install-godot.sh ~/godot-mono 4.7.2-stable mono

      - name: Import
        run: ~/godot-mono/godot --headless --path . --import

      - name: C# tests
        run: ~/godot-mono/godot --headless --path . --script tests/run_all.gd -- csharp
