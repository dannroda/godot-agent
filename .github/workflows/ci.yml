name: CI

on:
  push:
    # sm/**: las ramas de trabajo de las sesiones, para que el CI las vea antes de llegar a main (m16-12).
    branches: [main, 'sm/**']
  pull_request:
  workflow_call:

# Un grupo por workflow y ref: una rama sm/* nunca cancela ni hace esperar a main, y el CI que llama el
# release (workflow_call, con el nombre del release) no comparte grupo con el push a main. Un push nuevo
# a la misma rama o PR cancela la corrida vieja; en main no se cancela nada.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Tests (Godot ${{ matrix.godot }} · ${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # La mínima soportada, la estable actual y la beta en la que se desarrolla.
        godot: [4.7.2-stable, 4.8-beta3]
        # Los checks en tres grupos que corren a la vez, de ~3,5 min cada uno en 4.7.2 (corridos uno tras
        # otro en un solo job eran ~10 min). Cada step corre solo en su grupo; los demás lo saltean.
        group: [unit, game, editor]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: ~/godot
          key: godot-${{ matrix.godot }}

      - name: Install Godot
        run: sh .github/scripts/install-godot.sh ~/godot ${{ matrix.godot }}

      - name: Import
        run: ~/godot/godot --headless --path . --import

      # Los checkpoints del One-shot hacen commits en un repo de prueba.
      - name: Git identity
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@users.noreply.github.com"

      # Cada check sale de tests/suite.sh (la misma lista que corre `tests/suite.sh ci` en local) y va en
      # su propio step: uno que falla no esconde a los siguientes. El último step comprueba que este
      # archivo corre todos los checks de ci de la suite.
      - name: Unit tests
        if: ${{ !cancelled() && matrix.group == 'unit' }}
        run: sh tests/suite.sh run run_all ~/godot/godot

      - name: ACP against the fake agent
        if: ${{ !cancelled() && matrix.group == 'unit' }}
        run: sh tests/suite.sh run acp ~/godot/godot

      - name: One-shot loop
        if: ${{ !cancelled() && matrix.group == 'game' }}
        run: sh tests/suite.sh run oneshot_loop ~/godot/godot

      # Playtests guardados, repetidos sin el editor ni el agente (m16-09).
      - name: Regressions from the command line
        if: ${{ !cancelled() && matrix.group == 'game' }}
        run: sh tests/suite.sh run regressions ~/godot/godot

      # Nada del addon llega a un export (M0).
      - name: Export check
        if: ${{ !cancelled() && matrix.group == 'game' }}
        run: sh tests/suite.sh run export ~/godot/godot

      # Habilitar y deshabilitar el plugin 5 veces sin huérfanos ni recursos colgados (m13-10).
      - name: Plugin enable/disable cycle
        if: ${{ !cancelled() && matrix.group == 'unit' }}
        run: sh tests/suite.sh run plugin_cycle ~/godot/godot

      # Con el juego de verdad, en un editor con ventana (m16-02).
      - name: Install Xvfb
        if: ${{ !cancelled() && matrix.group != 'unit' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri

      - name: Editor check (run)
        if: ${{ !cancelled() && matrix.group == 'game' }}
        run: sh tests/suite.sh run run ~/godot/godot

      - name: Editor check (plan)
        if: ${{ !cancelled() && matrix.group == 'editor' }}
        run: sh tests/suite.sh run plan ~/godot/godot

      - name: Editor check (project checks after the turn)
        if: ${{ !cancelled() && matrix.group == 'editor' }}
        run: sh tests/suite.sh run checks ~/godot/godot

      - name: Editor check (review)
        if: ${{ !cancelled() && matrix.group == 'editor' }}
        run: sh tests/suite.sh run review ~/godot/godot

      - name: Editor check (run-error)
        if: ${{ !cancelled() && matrix.group == 'editor' }}
        run: sh tests/suite.sh run run-error ~/godot/godot

      - name: Editor check (debug)
        if: ${{ !cancelled() && matrix.group == 'editor' }}
        run: sh tests/suite.sh run debug ~/godot/godot

      - name: Editor check (external)
        if: ${{ !cancelled() && matrix.group == 'editor' }}
        run: sh tests/suite.sh run external ~/godot/godot

      - name: Editor check (edit)
        if: ${{ !cancelled() && matrix.group == 'editor' }}
        run: sh tests/suite.sh run edit ~/godot/godot

      - name: Editor check (mcp)
        if: ${{ !cancelled() && matrix.group == 'editor' }}
        run: sh tests/suite.sh run mcp ~/godot/godot

      # Que el menú contextual «Ask the agent» deja el contexto en el composer (m11-54).
      - name: Editor check (ask-menu)
        if: ${{ !cancelled() && matrix.group == 'editor' }}
        run: sh tests/suite.sh run ask-menu ~/godot/godot

      # Hooks del proyecto con guardados de verdad y la aprobación por máquina (m11-24).
      - name: Editor check (hooks)
        if: ${{ !cancelled() && matrix.group == 'editor' }}
        run: sh tests/suite.sh run hooks ~/godot/godot

      # Los trozos del último turno con ✓ y ✗ en el Script Editor, con snapshots de git (m11-66).
      - name: Editor check (turn-marks)
        if: ${{ !cancelled() && matrix.group == 'editor' }}
        run: sh tests/suite.sh run turn-marks ~/godot/godot

      # Segunda opinión de otro agente, de solo lectura, con dos agentes falsos (m11-28).
      # Modos del proyecto (m11-39): escrituras fuera de los archivos del modo rechazadas sin tarjeta (Edit,
      # fs/write, godot.create_scene, una tool que no dice qué escribe) y la shell que pregunta en Auto.
      - name: Editor check (ui-modes)
        if: ${{ !cancelled() && matrix.group == 'editor' }}
        run: sh tests/suite.sh run ui-modes ~/godot/godot

      # Tooltips que no se cierran solos (m12-51): con un turno que manda usage_update y la cuota, el
      # tooltip de cada control de la barra del composer y del encabezado sigue abierto 3 s.
      - name: Editor check (ui-tooltips)
        if: ${{ !cancelled() && matrix.group == 'editor' }}
        run: sh tests/suite.sh run ui-tooltips ~/godot/godot

      - name: Editor check (second-opinion)
        if: ${{ !cancelled() && matrix.group == 'editor' }}
        run: sh tests/suite.sh run second-opinion ~/godot/godot

      # run_scene con varias instancias (server y cliente ENet) y game_instance (m11-50).
      - name: Editor check (instances)
        if: ${{ !cancelled() && matrix.group == 'editor' }}
        run: sh tests/suite.sh run instances ~/godot/godot

      # godot.bake (navegación con deshacer, occluders con el botón del editor, lightmaps con Compatibility
      # da error) y export_project (pack, sin plantillas) (m11-53). Hornear lightmaps necesita Vulkan:
      # bake-lightmaps va en la suite full.
      - name: Editor check (bake)
        if: ${{ !cancelled() && matrix.group == 'editor' }}
        run: sh tests/suite.sh run bake ~/godot/godot

      # Un playtest con el agente en loop se corta como «could not test» (m11-49).
      - name: Editor check (playtest-loop)
        if: ${{ !cancelled() && matrix.group == 'editor' }}
        run: sh tests/suite.sh run playtest-loop ~/godot/godot

      # Reiniciar el editor y retomar las pestañas con el agente falso (m12-54).
      - name: Editor check (restart)
        if: ${{ !cancelled() && matrix.group == 'editor' }}
        run: sh tests/suite.sh run restart ~/godot/godot

      - name: Closing the editor leaves no agent processes
        if: ${{ !cancelled() && matrix.group == 'editor' }}
        run: sh tests/suite.sh run quit ~/godot/godot

      - name: Every ci check of the suite runs here
        if: ${{ !cancelled() }}
        run: sh tests/suite.sh check-ci

  # C# (m14-07): validate_scripts compila con dotnet build; el test compila un proyecto de verdad.
  csharp:
    name: C# (Godot .NET 4.7.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/cache@v6
        with:
          path: ~/godot-mono
          key: godot-mono-4.7.2-stable

      - name: Install Godot .NET
        run: sh .github/scripts/install-godot.sh ~/godot-mono 4.7.2-stable mono

      - name: Import
        run: ~/godot-mono/godot --headless --path . --import

      - name: C# tests
        run: ~/godot-mono/godot --headless --path . --script tests/run_all.gd -- csharp
